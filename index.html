<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi día contigo</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi día">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--ink:#1C1C1E;--mute:#6C6C70;--chip:#F2F2F7;--seg:#E3E3E8;--segon:#FFFFFF;--sum:#1C1C1E;--sumink:#F2F2F7;--cat:#1C1C1E;--accent:#C2334D;--btn:#C2334D;color-scheme:light dark;
--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-ios:cubic-bezier(0.32,0.72,0,1);--ease-pop:cubic-bezier(0.34,1.36,0.64,1)}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--card:#1C1C1E;--ink:#F2F2F7;--mute:#98989F;--chip:#2C2C2E;--seg:#1C1C1E;--segon:#636366;--sum:#2C2C2E;--sumink:#F2F2F7;--cat:#D1D1D6;--accent:#EF5A74}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,textarea,input{font-family:inherit}[hidden]{display:none!important}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* Respuesta al pulsar: "scale" independiente para no pisar las animaciones de transform */
.cta,.send,.ok,.pill{transition:scale 160ms var(--ease-out)}
.cta:active,.send:active,.ok:active{scale:.97}
.pill:active{scale:.95}
.back,.again,.fate{transition:opacity 160ms ease}
.back:active,.again:active,.fate:active{opacity:.5}
textarea,input[type=text]{outline:none}
textarea::placeholder,input::placeholder{color:#8E8E93}
.screen{min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column}

/* Portada */
/* La portada ocupa justo la pantalla: la foto se adapta para que el botón se vea siempre sin scroll */
#home{max-width:390px;height:100vh;height:100dvh;min-height:520px;padding:calc(16px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom));justify-content:center;gap:clamp(12px,2.6vh,22px)}
#home.boot>*{animation:enter 600ms var(--ease-out) both}
#home.boot>:nth-child(2){animation-delay:70ms}
#home.boot>:nth-child(3){animation-delay:140ms}
#home.in{animation:homeIn 320ms var(--ease-ios)}
.head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--mute)}
#greet{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em}
#phrase{margin:0;max-width:300px;font-size:15px;line-height:1.4;color:var(--mute)}
.pillt{margin-top:4px;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--accent)}
#anni{font-size:13px;color:var(--mute)}
.photo{width:min(346px,100%);flex:1 1 0;min-height:150px;max-height:560px;align-self:center;overflow:hidden;border-radius:32px;box-shadow:0 12px 32px rgba(194,51,77,.18);background:var(--seg)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 45%;animation:zoom 14s ease-in-out infinite alternate}
.ctaw{position:relative;padding-top:72px}
.ctaw .cat{position:absolute;right:22px;top:0;overflow:visible}
.cta{width:100%;min-height:64px;border:none;border-radius:18px;background:var(--btn);color:#fff;font-size:19px;font-weight:700;padding:0 20px;box-shadow:0 8px 20px rgba(194,51,77,.32);animation:pulse 2.6s ease-in-out infinite}
.cb{fill:#111113;stroke:#8E8E93;stroke-opacity:.45;stroke-width:1}.cw{fill:#FAFAFA}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 2.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}

/* Plan de hoy */
#plan{max-width:430px;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));gap:20px;animation:slideIn 320ms var(--ease-ios)}
.top{display:flex;flex-direction:column;gap:4px}
.back{align-self:flex-start;min-height:44px;padding:0;border:none;background:transparent;color:var(--accent);font-size:17px;display:flex;align-items:center;gap:2px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.grp{display:flex;flex-direction:column;gap:8px}
.fd{animation:fadeDown 260ms var(--ease-out)}
.sec{padding:0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--mute)}
.card{background:var(--card);border-radius:18px;padding:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 15px;border:none;border-radius:999px;background:var(--chip);color:var(--ink);font-size:15px;font-weight:500;transition:scale 160ms var(--ease-out),background-color 200ms ease,color 200ms ease}
.pill[aria-pressed=true]{background:#C2334D;color:#fff;font-weight:600}
.inp{width:100%;min-height:50px;border:none;border-radius:18px;background:var(--card);padding:0 16px;font-size:16px;color:var(--ink)}
.seg{position:relative;display:flex;background:var(--seg);border-radius:10px;padding:2px;gap:2px}
.seg button{position:relative;flex:1;min-height:40px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed=true]{font-weight:700}
/* Fondo del seleccionado: una sola pieza que se desliza entre opciones */
.thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 10px) / 4);border-radius:8px;background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:transform 300ms var(--ease-ios),opacity 200ms ease}
.love{position:relative;background:var(--card);border-radius:18px;padding:14px 16px 12px}
.lt{display:flex;align-items:center;justify-content:space-between}
.q{font-size:15px}
.rt{display:flex;align-items:center;gap:6px}
.hb{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.hb svg{animation:beat 1s ease-in-out infinite}
.pct{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--accent);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:40px;accent-color:#C2334D;margin:0}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
#loveLabel{margin-top:6px;font-size:15px;font-weight:500}
/* Corazoncitos (>90): solo en una columna de 46x46 sobre el corazón grande */
#risers{position:absolute;right:100px;top:14px;width:46px;height:46px;pointer-events:none;overflow:visible}
#risers svg{position:absolute;top:14px;width:14px;height:14px;opacity:0;animation:rise 1.8s ease-out infinite}
textarea{width:100%;border:none;border-radius:18px;background:var(--card);padding:14px 16px;font-size:16px;line-height:1.4;color:var(--ink);resize:none}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.send{min-height:54px;border:none;border-radius:16px;background:var(--btn);color:#fff;font-size:17px;font-weight:700}
.send:disabled{opacity:.6}
.err{margin:0 6px;color:var(--accent);font-size:14px}
.done{background:var(--sum);color:var(--sumink);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.45;animation:doneIn 450ms var(--ease-pop) both}
.done b{display:block;font-size:18px;font-weight:700;margin-bottom:4px}
.again{min-height:44px;border:none;border-radius:14px;background:transparent;color:var(--accent);font-size:16px;font-weight:600}

/* Pop-up "Me da igual" */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;animation:fade 200ms ease both}
.dlg{width:280px;background:var(--card);border-radius:18px;padding:18px 20px 16px;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.3);animation:dlgIn 300ms var(--ease-pop) both}
/* Salida más rápida que la entrada */
#modal.out{animation:fadeOut 160ms ease both}
#modal.out .dlg{animation:dlgOut 160ms ease both}
.dlg .cat{align-self:center;overflow:visible;animation:wobble 2.4s ease-in-out infinite}
.dlg p{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.dlg .ok{min-height:44px;border:none;border-radius:12px;background:var(--btn);color:#fff;font-size:17px;font-weight:700}
.dlg .fate{min-height:40px;border:none;background:transparent;color:var(--accent);font-size:15px;font-weight:600}
.dlg .lbl{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--mute)}
.dlg .rl{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--accent);min-height:44px;overflow:hidden}
.dlg .rl span{display:inline-block}

/* Lluvia de corazones al enviar */
#rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}
#rain svg{position:absolute;top:0;animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:both}

@keyframes slideIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes homeIn{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes enter{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes dlgIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes dlgOut{from{transform:none;opacity:1}to{transform:scale(.96);opacity:0}}
@keyframes doneIn{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.09)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(0.96)}}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(1240px) rotate(40deg);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(0.6);opacity:0}20%{opacity:1}100%{transform:translateY(-48px) scale(1);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
/* Movimiento reducido: fuera desplazamientos y escalas, pero se mantienen fundidos suaves */
@media (prefers-reduced-motion: reduce){
*{animation:none!important}
#rain,#risers{display:none}
#plan,#home.in,.fd,.done,#modal,.dlg{animation:fade 200ms ease both!important}
#modal.out,#modal.out .dlg{animation:fadeOut 160ms ease both!important}
button,.pill,.thumb{transition-property:opacity,background-color,color!important}
button:active{scale:none!important}}
</style>
</head>
<body>
<div id="home" class="screen boot">
 <div class="head">
  <div class="brand">BERTA &amp; ADRI</div>
  <h2 id="greet"></h2>
  <p id="phrase"></p>
  <div class="pillt"><svg width="14" height="14" viewBox="0 0 24 24" fill="#C2334D" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="tog"></span></div>
  <div id="anni"></div>
 </div>
 <div class="photo"><img src="foto.jpg" alt="Berta y Adri" width="346" height="560"></div>
 <div class="ctaw">
  <svg class="cat" width="86" height="72" viewBox="0 0 100 84" aria-hidden="true"><path class="tail" d="M72 80 C96 82 98 58 88 50" fill="none" stroke="#111113" stroke-width="7" stroke-linecap="round"/><path class="cb" d="M22 84 C14 60 26 42 50 42 C74 42 86 60 78 84 Z"/><path class="cw" d="M36 84 C32 66 40 52 50 52 C60 52 68 66 64 84 Z"/><ellipse class="cb" cx="61" cy="80" rx="4.5" ry="3"/><polygon class="cb" points="29,22 30,3 45,14"/><polygon class="cb" points="55,14 70,3 71,22"/><ellipse class="cb" cx="50" cy="30" rx="22" ry="19"/><ellipse class="cw" cx="50" cy="42" rx="15" ry="10"/><polygon class="cw" points="47,12 53,12 56,36 44,36"/><g class="eye"><circle cx="40" cy="29" r="5.6" fill="#F2C94C"/><circle cx="40" cy="29" r="3.3" fill="#111113"/><circle cx="41.3" cy="27.6" r="1.1" fill="#fff"/></g><g class="eye"><circle cx="60" cy="29" r="5.6" fill="#F2C94C"/><circle cx="60" cy="29" r="3.3" fill="#111113"/><circle cx="61.3" cy="27.6" r="1.1" fill="#fff"/></g><path d="M41 41 C43 38 47 39 50 41 C53 39 57 38 59 41 C58 46 54 48 50 47 C46 48 42 46 41 41 Z" fill="#111113"/></svg>
  <button class="cta" id="go">¿Qué harán hoy los gordopapas?</button>
 </div>
</div>

<div id="plan" class="screen" hidden>
 <div class="top">
  <button class="back" id="back"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"/></svg>Inicio</button>
  <h1>Plan de hoy</h1>
 </div>
 <div class="grp"><div class="sec">PLAN</div><div class="card"><div class="pills" id="pActs"></div></div></div>
 <div id="subBox" hidden></div>
 <div id="fieldBox" hidden></div>
 <div class="grp"><div class="sec">PRESUPUESTO</div><div class="seg" id="pBud"></div></div>
 <div class="grp"><div class="sec">NIVEL DE AMOR</div>
  <div class="love">
   <div class="lt"><div class="q">¿Cuánto quieres a Adri hoy?</div>
    <div class="rt"><div class="hb" id="hb"></div><div class="pct"><span id="pct">50</span>%</div></div></div>
   <input id="love" type="range" min="0" max="100" step="1" value="50" aria-label="Nivel de amor de hoy">
   <div class="ends"><span>Poquito</span><span>Muchísimo</span></div>
   <div id="loveLabel"></div>
   <div id="risers" hidden></div>
  </div>
 </div>
 <div class="grp"><div class="sec">¿ALGO MÁS?</div>
  <textarea id="extra" rows="3" maxlength="500" placeholder="Escribe aquí una petición extra…"></textarea></div>
 <div class="foot">
  <button class="send" id="send">Enviar a Adri</button>
  <p class="err" id="err" role="alert" hidden></p>
  <div class="done" id="done" hidden><b>Listo, Berta</b><span id="summary"></span></div>
  <button class="again" id="again" hidden>Cambiar respuestas</button>
 </div>
</div>

<div id="modal" hidden><div class="dlg" role="alertdialog" aria-modal="true" id="dlg"></div></div>
<div id="rain"></div>

<script>
const ENDPOINT="https://midia-berta.adrirute18.workers.dev";
// FECHA DE INICIO DE LA RELACIÓN: AAAA-MM-DD
const START_DATE="2020-02-07";
const PHRASES=["Hoy toca ser felices, lo demás ya se verá.","Contigo hasta el lunes se ve bonito.","Eres mi plan favorito de todos los planes.","Hoy mando yo menos: tú eliges y yo disfruto.","Que el día sea corto y los mimos largos.","Si hoy fuera un gato, estaría ronroneando por ti.","Tú eliges, yo me encargo de que salga genial.","Cada día contigo es de los buenos.","Hoy el plan es sencillo: pasarlo bien juntos.","Un día sin ti es como un gato sin siesta: no funciona.","Eres mi parte favorita del día.","Hoy tengo ganas de ti y de lo que quieras hacer."];
const FOOD=["Pizza","Sushi","Hamburguesa","Tapas","Me da igual"];
const REST={label:"¿ALGÚN RESTAURANTE EN CONCRETO?",ph:"Nombre del restaurante",short:"restaurante"};
const HOME={
  "Peli en casa":{label:"IDEA DE PELI",ph:"¿Qué peli te apetece ver?",short:"peli"},
  "Cena en casa fitness":{label:"IDEA DE CENA",ph:"¿Qué cenamos?",short:"cena"},
  "Ver nuestra serie":{label:"¿QUÉ SERIE O CAPÍTULO?",ph:"Serie o capítulo",short:"serie"},
  "Merendar juntos":{label:"IDEA DE MERIENDA",ph:"¿Qué merendamos?",short:"merienda"}
};
const CFG={
  "Almuerzo":{subTitle:"¿QUÉ TE APETECE COMER?",subs:FOOD,field:()=>REST},
  "Cena":{subTitle:"¿QUÉ TE APETECE COMER?",subs:FOOD,field:()=>REST},
  "Cine":{subTitle:"¿DE QUÉ GÉNERO?",subs:["Comedia","Romántica","Acción","Terror","Animación"],
    field:()=>({label:"¿QUÉ PELÍCULA QUIERES VER?",ph:"Título de la película",short:"película"})},
  "Plan en casa":{subTitle:"¿QUÉ HACEMOS EN CASA?",subs:Object.keys(HOME),field:sub=>HOME[sub]},
  "Pasear":{subTitle:"¿POR DÓNDE?",subs:["Por la ciudad","Junto al mar","Naturaleza","Con helado"],
    field:()=>({label:"¿ALGÚN SITIO EN CONCRETO?",ph:"Lugar o ruta",short:"sitio"})},
  "Escapada":{subTitle:"¿QUÉ TIPO DE ESCAPADA?",subs:["Mar","Montaña","Ciudad","Pueblo"],
    field:()=>({label:"¿ALGÚN DESTINO EN MENTE?",ph:"Destino",short:"destino"})},
  "Amigos":{subTitle:"¿QUÉ PLAN?",subs:["Tomar algo","Cenar","En casa","Salir de fiesta"],
    field:()=>({label:"¿CON QUIÉN?",ph:"Con quién quedamos",short:"con"})}
};
const ROULETTE=["Almuerzo","Cena","Cine","Plan en casa","Pasear","Escapada","Amigos"];
const ACTS=[...ROULETTE,"Me da igual"];
const BUD=["Nada","20 €","50 €","Sin mirar"];
const KEY="midia-v4";

let st={act:null,sub:null,txt:"",budget:null,love:50,extra:"",sent:false};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
// Limpia valores guardados que ya no sean válidos ("Me da igual" nunca se guarda ni se envía)
if(!CFG[st.act])st.act=null;
if(!st.act||!CFG[st.act].subs.includes(st.sub)||st.sub==="Me da igual")st.sub=null;
if(!BUD.includes(st.budget))st.budget=null;
st.love=Math.min(100,Math.max(0,Number(st.love)||0));
st.txt=String(st.txt||"");st.extra=String(st.extra||"");

const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const HEART='<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
const heart=(fill,style)=>`<svg viewBox="0 0 24 24" fill="${fill}" aria-hidden="true" style="${style}">${HEART}</svg>`;
const CATFACE='<svg class="cat" width="88" height="88" viewBox="0 0 100 100" aria-hidden="true"><polygon class="cb" points="16,42 18,6 42,22"/><polygon class="cb" points="84,42 82,6 58,22"/><ellipse class="cb" cx="50" cy="54" rx="35" ry="31"/><ellipse class="cw" cx="50" cy="68" rx="23" ry="16"/><polygon class="cw" points="46,22 54,22 59,58 41,58"/><circle cx="33" cy="50" r="8.5" fill="#F2C94C"/><circle cx="67" cy="50" r="8.5" fill="#F2C94C"/><circle cx="33" cy="52" r="5" fill="#111113"/><circle cx="67" cy="52" r="5" fill="#111113"/><rect x="23" y="38" width="20" height="9" fill="#111113"/><rect x="57" y="38" width="20" height="9" fill="#111113"/><path d="M38 63 C42 59 47 60 50 63 C53 60 58 59 62 63 C60 71 55 73 50 71 C45 73 40 71 38 63 Z" fill="#111113"/><path d="M4 60 L24 62 M4 70 L24 68 M96 60 L76 62 M96 70 L76 68" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>';

/* Portada */
function together(now){
  const s=new Date(START_DATE+"T00:00:00");
  let y=now.getFullYear()-s.getFullYear(),m=now.getMonth()-s.getMonth(),d=now.getDate()-s.getDate();
  if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  const p=[];
  if(y>0)p.push(y+(y===1?" año":" años"));
  if(m>0)p.push(m+(m===1?" mes":" meses"));
  if(d>0)p.push(d+(d===1?" día":" días"));
  if(!p.length)return "Recién empezamos";
  return (p.length>1?p.slice(0,-1).join(", ")+" y "+p[p.length-1]:p[0])+" juntos";
}
function anniv(now){
  const s=new Date(START_DATE+"T00:00:00"),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let next=new Date(now.getFullYear(),s.getMonth(),s.getDate());
  if(next<today)next=new Date(now.getFullYear()+1,s.getMonth(),s.getDate());
  const diff=Math.round((next-today)/864e5),n=next.getFullYear()-s.getFullYear();
  if(diff===0)return "¡Hoy es vuestro aniversario! "+n+" años";
  return (diff===1?"Falta 1 día":"Faltan "+diff+" días")+" para vuestro "+n+".º aniversario";
}
function home(){
  const now=new Date(),h=now.getHours();
  $("#greet").textContent=(h<6||h>=20?"Buenas noches":h<13?"Buenos días":"Buenas tardes")+", Berta";
  $("#phrase").textContent=PHRASES[Math.floor(now.getTime()/864e5)%PHRASES.length];
  $("#tog").textContent=together(now);
  $("#anni").textContent=anniv(now);
}

/* Plan */
const pills=list=>list.map(o=>`<button type="button" class="pill" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("");
const fieldInfo=()=>st.act&&st.sub?CFG[st.act].field(st.sub):null;
// Los botones se crean una vez y solo cambia aria-pressed, para que las transiciones de color funcionen
function renderSub(fade){
  const cfg=CFG[st.act],sb=$("#subBox");
  sb.hidden=!cfg;
  if(!cfg){sb.innerHTML="";return}
  sb.className="grp"+(fade?" fd":"");
  sb.innerHTML=`<div class="sec">${esc(cfg.subTitle)}</div><div class="card"><div class="pills" id="pSub">${pills(cfg.subs)}</div></div>`;
}
const press=(sel,cur)=>document.querySelectorAll(sel+" [data-o]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.o===cur));
let thumbOn=false;
function moveThumb(){
  const t=$("#thumb"),i=BUD.indexOf(st.budget);
  if(i<0){t.style.opacity=0;thumbOn=false;return}
  const tf=`translateX(calc(${i} * 100% + ${i*2}px))`;
  if(!thumbOn){t.style.transition="none";t.style.transform=tf;t.offsetWidth;t.style.transition="";thumbOn=true}
  else t.style.transform=tf;
  t.style.opacity=1;
}
function syncPlan(){press("#pActs",st.act);press("#pSub",st.sub);press("#pBud",st.budget);moveThumb();sentUI()}
function pop(el){
  if(reduce||!el)return;
  el.animate([{transform:"scale(1)"},{transform:"scale(1.06)",offset:.4},{transform:"scale(1)"}],{duration:260,easing:"cubic-bezier(0.23,1,0.32,1)"});
}
function renderField(fade){
  const f=fieldInfo(),fb=$("#fieldBox");
  fb.hidden=!f;
  if(!f){fb.innerHTML="";return}
  fb.className="grp"+(fade?" fd":"");
  fb.innerHTML=`<div class="sec">${esc(f.label)}</div><input type="text" class="inp" id="txt" maxlength="80" placeholder="${esc(f.ph)}">`;
  const i=$("#txt");i.value=st.txt;
  i.oninput=e=>{st.txt=e.target.value;st.sent=false;save();sentUI()};
}
function summary(){
  const f=fieldInfo(),txt=st.txt.trim();
  let plan=st.act?st.act.toLowerCase():"lo que surja";
  if(st.act&&st.sub)plan+=" ("+st.sub.toLowerCase()+")";
  if(f&&txt)plan+=", "+f.short+": "+txt;
  let t="Adri ya lo sabe: hoy te apetece "+plan+", gastar "+(st.budget?st.budget.toLowerCase():"lo justo")+" y tu nivel de amor por Adri es "+st.love+"%.";
  if(st.extra.trim())t+=" Extra: "+st.extra.trim();
  return t;
}
function sentUI(){$("#send").hidden=st.sent;$("#done").hidden=$("#again").hidden=!st.sent;$("#summary").textContent=summary()}
function loveText(v){return v>90?"Nivel máximo, no cabe más":v>70?"Hoy estoy muy enamorada":v>45?"Te quiero un montón":v>20?"Te quiero, pero el café va primero":"Hoy necesito mimos extra"}
function renderLove(){
  const v=st.love,hs=Math.round(20+v*.2);
  $("#love").value=v;$("#pct").textContent=v;$("#loveLabel").textContent=loveText(v);
  // Se reutiliza el mismo corazón: recrearlo en cada movimiento reiniciaba el latido
  const hb=$("#hb svg").style;hb.width=hb.height=hs+"px";hb.animationDuration=(1.5-v*.011).toFixed(2)+"s";
  const r=$("#risers"),max=v>90;
  if(max&&r.hidden)r.innerHTML=[0,14,28,42,56,70].map((p,i)=>heart("#E8758A",`left:${p}%;animation-delay:${(i*.3).toFixed(1)}s`)).join("");
  r.hidden=!max;
}
function pick(k,o){
  if(o==="Me da igual"){openModal();return}
  if(k==="act"){const c=st.act!==o;st.act=o;if(c){st.sub=null;st.txt="";renderSub(true);renderField(false)}}
  else if(k==="sub"){const c=st.sub!==o;st.sub=o;if(c){st.txt="";renderField(true)}}
  else st.budget=o;
  st.sent=false;save();syncPlan();
  if(k!=="bud")pop([...document.querySelectorAll(k==="act"?"#pActs [data-o]":"#pSub [data-o]")].find(b=>b.dataset.o===o));
}
$("#plan").addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b)return;
  pick(b.closest("#pActs")?"act":b.closest("#pSub")?"sub":"bud",b.dataset.o)});

/* Pop-up y ruleta */
function openModal(){
  $("#dlg").innerHTML=CATFACE+'<p>Obviamente no vale decir me da igual listilla, elige</p><button class="ok" id="ok">Vale, elijo</button><button class="fate" id="fate">…o que decida el destino</button>';
  $("#modal").classList.remove("out");$("#modal").hidden=false;
  $("#ok").onclick=()=>closeModal();
  $("#fate").onclick=spin;
}
function closeModal(after){
  const m=$("#modal");m.classList.add("out");
  setTimeout(()=>{m.hidden=true;m.classList.remove("out");if(after)after()},160);
}
function spin(){
  $("#dlg").innerHTML=CATFACE+'<div class="lbl">EL DESTINO DECIDE</div><div class="rl"><span id="rl"></span></div>';
  const rl=$("#rl"),ease="cubic-bezier(0.23,1,0.32,1)";
  const show=(t,last)=>{rl.textContent=t;if(reduce)return;
    rl.animate(last?[{transform:"scale(.9)",opacity:.5},{transform:"scale(1.08)",offset:.5},{transform:"none",opacity:1}]
                   :[{transform:"translateY(-40%)",opacity:0},{transform:"none",opacity:1}],{duration:last?360:90,easing:ease})};
  let i=0;
  (function step(){
    if(i<12){show(ROULETTE[(i*3+1)%ROULETTE.length]);i++;setTimeout(step,70+i*14)}
    else{const f=ROULETTE[Math.floor(Math.random()*ROULETTE.length)];show(f,true);
      setTimeout(()=>closeModal(()=>pick("act",f)),900)}
  })();
}

/* Envío */
function rain(){
  if(reduce)return;
  const colors=["#C2334D","#E8758A","#F4A6B4","#D6455D"];let h="";
  for(let i=0;i<16;i++){const size=18+((i*7)%16);
    h+=heart("currentColor",`left:${((i*37)%92)+2}%;width:${size}px;height:${size}px;animation-delay:${((i%8)*.15).toFixed(2)}s;animation-duration:${(2.2+(i%5)*.35).toFixed(2)}s;color:${colors[i%4]}`)}
  const r=$("#rain");r.innerHTML=h;setTimeout(()=>{r.innerHTML=""},5200);
}
$("#send").onclick=async()=>{
  const b=$("#send"),err=$("#err");err.hidden=true;
  if(!st.act){err.textContent="Elige un plan antes de enviar.";err.hidden=false;return}
  b.disabled=true;b.textContent="Enviando…";
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({act:st.act,sub:st.sub||"",detail:fieldInfo()?st.txt.trim():"",budget:st.budget||"",love:st.love,extra:st.extra.trim()})});
    if(!r.ok)throw 0;st.sent=true;save();rain();
  }catch(e){err.textContent="No se pudo enviar. Revisa la conexión y prueba otra vez.";err.hidden=false}
  b.disabled=false;b.textContent="Enviar a Adri";sentUI();
};
$("#again").onclick=()=>{st.sent=false;save();sentUI()};
$("#love").addEventListener("input",e=>{st.love=+e.target.value;st.sent=false;save();renderLove();sentUI()});
$("#extra").addEventListener("input",e=>{st.extra=e.target.value;st.sent=false;save();sentUI()});
// Al mostrar una pantalla oculta su animación de entrada vuelve a empezar sola
const show=p=>{const h=$("#home");h.classList.remove("boot");h.hidden=p;$("#plan").hidden=!p;
  if(!p){home();h.classList.add("in")}scrollTo(0,0)};
$("#go").onclick=()=>show(true);
$("#back").onclick=()=>show(false);
// iOS Safari solo aplica :active si hay algún listener táctil
document.addEventListener("touchstart",()=>{},{passive:true});
$("#pActs").innerHTML=pills(ACTS);
$("#pBud").innerHTML='<span class="thumb" id="thumb" aria-hidden="true"></span>'+BUD.map(o=>`<button type="button" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("");
$("#hb").innerHTML=heart("#C2334D","");
$("#extra").value=st.extra;home();renderSub(false);renderField(false);syncPlan();renderLove();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
